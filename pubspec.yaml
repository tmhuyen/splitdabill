name: splitdabill
description: "Bill splitting app with OCR and Excel export."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # OCR
  google_mlkit_text_recognition: ^0.6.0

  # Excel Export
  excel: ^2.1.0

  # Image Picking
  image_picker: ^1.0.0

  # File Handling
  path_provider: ^2.1.0
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

  # Date/Time
  intl: ^0.19.0

  # UUID
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
